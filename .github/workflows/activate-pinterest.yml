name: Activate and run first Pinterest publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinterest-publisher
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Enable reviewed Standard publishing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atf scripts/activate-pinterest.sql
      - name: Run one guarded publication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/run-pinterest-publisher.mjs
      - name: Verify durable outcome
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atf scripts/verify-pinterest-publication.sql
