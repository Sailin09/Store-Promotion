name: Capture Etsy stock evidence
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: etsy-cloud-evidence
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/capture-etsy-stock.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etsy-evidence
          path: etsy-evidence/
          retention-days: 7
