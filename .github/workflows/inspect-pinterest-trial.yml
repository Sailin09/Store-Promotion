name: Inspect Pinterest Trial account
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-pinterest-trial.yml']
  workflow_dispatch:
    inputs:
      handle:
        description: Connected Pinterest account
        type: choice
        default: sailing_981
        options: [sailing_981, icyndizhang, mydecorshop, cindyzhang62, ivy5205]
permissions:
  contents: read
concurrency:
  group: pinterest-trial-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -n "$PINTEREST_HANDLE" ]; then
            node scripts/inspect-pinterest-trial.mjs
          else
            for account in icyndizhang sailing_981 mydecorshop cindyzhang62 ivy5205; do
              PINTEREST_HANDLE="$account" node scripts/inspect-pinterest-trial.mjs
            done
          fi
        env:
          PINTEREST_HANDLE: ${{ inputs.handle }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
