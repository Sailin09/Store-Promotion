name: Inspect Pinterest Trial account
on:
  workflow_dispatch:
    inputs:
      handle:
        description: Connected Pinterest account
        type: choice
        default: sailing_981
        options: [sailing_981, icyndizhang, mydecorshop, cindyzhang62, ivy5205]
permissions:
  contents: read
concurrency:
  group: pinterest-trial-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-pinterest-trial.mjs
        env:
          PINTEREST_HANDLE: ${{ inputs.handle }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
