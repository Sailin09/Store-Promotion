name: Deploy Supabase Migrations
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/**', '.github/workflows/deploy-supabase.yml', '.github/workflows/publisher-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/publisher-tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - name: Deploy publisher with existing Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy pinterest-publisher --project-ref czexstqnkogfvqyjvatr
