name: Deploy Supabase Migrations
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/**', 'scripts/pinterest-scheduler.sql', 'scripts/install-pinterest-scheduler.mjs', '.github/workflows/deploy-supabase.yml', '.github/workflows/publisher-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/publisher-tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - name: Deploy publisher with existing Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy pinterest-publisher --project-ref czexstqnkogfvqyjvatr
          supabase functions deploy pinterest-trial-demo --project-ref czexstqnkogfvqyjvatr
      - name: Install reliable database scheduler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/install-pinterest-scheduler.mjs
      - name: Inspect scheduler status
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atf scripts/inspect-pinterest-scheduler.sql
