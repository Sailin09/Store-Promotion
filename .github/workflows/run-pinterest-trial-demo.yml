name: Run one Pinterest Trial demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinterest-trial-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-pinterest-trial-demo.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
