name: Cloud capability check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-capability-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configuration presence and storefront reachability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['OPENAI_API_KEY','ETSY_API_KEY','SUPABASE_DB_URL','SUPABASE_ACCESS_TOKEN']) console.log(JSON.stringify({configuration:name,present:Boolean(process.env[name])}));
          try {
            const r=await fetch('https://www.etsy.com/shop/Chtte',{signal:AbortSignal.timeout(20000)});
            const html=await r.text();
            console.log(JSON.stringify({storefront_http:r.status,has_listing_links:html.includes('/listing/'),challenge:/captcha|datadome|verify you are human/i.test(html)}));
          } catch {console.log(JSON.stringify({storefront_error:'network_unavailable'}));}
          NODE
